<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdCivics - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a3a8f 0%, #0a1f5c 100%);
        }

        .form-section {
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            padding: 50px;
            background: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        /* Hide the toggle buttons since we are on a dedicated page */
        .form-toggle {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Login Form -->
    <div class="form-section">
        <div class="form-container">
            <div class="form active" id="loginForm">
                <h2 class="form-title">Welcome Back</h2>
                <p class="form-subtitle">Enter your credentials to access your account</p>

                <form id="loginFormElement">
                    <div class="input-group">
                        <label class="input-label" for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" class="input-field" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password"
                            required>
                        <button type="button" class="password-toggle" id="toggleLoginPassword">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn" id="loginSubmitBtn">Sign In</button>
                </form>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="social-login">
                    <button class="social-btn">
                        <i class="fab fa-google google"></i> Google
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-facebook-f facebook"></i> Facebook
                    </button>
                </div>

                <div class="form-footer">
                    Don't have an account? <a href="register.html" id="switchToRegister" target="_blank">Create one
                        now</a>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
