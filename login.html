<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdCivics - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

    <!-- Login Form -->
    <div class="form-section">
        <div class="form-container">
            <div class="form active" id="loginForm">
                <h2 class="form-title">Welcome Back</h2>
                <p class="form-subtitle">Enter your credentials to access your account</p>

                <form id="loginFormElement">
                    <div class="input-group">
                        <div class="user-type-buttons">
                            <button type="button" class="user-type-btn active" id="loginCustomerBtn">
                                <i class="fas fa-user"></i> Citizen
                            </button>
                            <button type="button" class="user-type-btn" id="loginSellerBtn">
                                <i class="fas fa-store"></i> Municipal Staff
                            </button>
                        </div>

                        <div class="input-group">
                            <label class="input-label" id="loginEmailLabel" for="loginEmail">Email Address</label>
                            <input type="text" id="loginEmail" class="input-field" placeholder="you@example.com"
                                required>
                        </div>

                        <div class="input-group">
                            <label class="input-label" for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" class="input-field"
                                placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" id="toggleLoginPassword">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>

                        <div class="form-options">
                            <div class="remember-me">
                                <input type="checkbox" id="rememberMe">
                                <label for="rememberMe">Remember me</label>
                            </div>
                            <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
                        </div>

                        <button type="submit" class="submit-btn" id="loginSubmitBtn">Sign In</button>
                </form>

                <div class="form-footer">
                    Don't have an account? <a href="register.html" id="switchToRegister" target="_blank">Create one
                        now</a>
                </div>
            </div>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
