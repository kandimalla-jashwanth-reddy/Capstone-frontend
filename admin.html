<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CrowdCivic Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header>
        <h2>CrowdCivic – Admin Panel</h2>
        <div>
            <button onclick="toggleAdminProfile()"
                style="margin-right: 10px; background-color: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1;">Profile</button>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <section class="dashboard">
        <div class="user-info"
            style="display: none; margin-bottom: 2rem; background: #f8fafc; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0;">
            <h3>Admin Profile</h3>
            <p style="margin-bottom: 5px;"><strong>Name:</strong> <span id="adminName">Loading...</span></p>
            <p style="margin-bottom: 5px;"><strong>Email:</strong> <span id="adminEmail">Loading...</span></p>
            <p style="margin-bottom: 5px;"><strong>Department:</strong> <span id="adminDepartment">Loading...</span></p>
            <p style="margin-bottom: 5px;"><strong>Government ID:</strong> <span id="adminId">Loading...</span></p>
        </div>

        <h3>Reported Civic Issues</h3>

        <table>
            <thead>
                <tr>
                    <th>Issue ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Assign Dept</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="issueTable">
                <tr>
                    <td>101</td>
                    <td>Pothole on Road</td>
                    <td>Roads</td>
                    <td>Hyderabad</td>
                    <td>
                        <select>
                            <option>Pending</option>
                            <option>In Progress</option>
                            <option>Resolved</option>
                        </select>
                    </td>
                    <td>
                        <select>
                            <option>Roads Dept</option>
                            <option>Municipality</option>
                            <option>Water Dept</option>
                        </select>
                    </td>
                    <td>
                        <button class="update-btn">Update</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <script src="admin.js"></script>
</body>

</html>
