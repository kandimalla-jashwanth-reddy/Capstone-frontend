<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CrowdCivic Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header>
        <h2>CrowdCivic – Admin Panel</h2>
        <button onclick="logout()">Logout</button>
    </header>

    <section class="dashboard">
        <h3>Reported Civic Issues</h3>

        <table>
            <thead>
                <tr>
                    <th>Issue ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Assign Dept</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="issueTable">
                <tr>
                    <td>101</td>
                    <td>Pothole on Road</td>
                    <td>Roads</td>
                    <td>Hyderabad</td>
                    <td>
                        <select>
                            <option>Pending</option>
                            <option>In Progress</option>
                            <option>Resolved</option>
                        </select>
                    </td>
                    <td>
                        <select>
                            <option>Roads Dept</option>
                            <option>Municipality</option>
                            <option>Water Dept</option>
                        </select>
                    </td>
                    <td>
                        <button class="update-btn">Update</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <script src="admin.js"></script>
</body>

</html>
