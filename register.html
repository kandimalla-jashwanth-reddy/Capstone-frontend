<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdCivics - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

    <div class="form-section">
        <div class="form-container">
            <div class="form active" id="registerForm">
                <div id="message" class="message"></div>
                <h2 class="form-title">Create Account</h2>
                <p class="form-subtitle">Join CrowdCivics and start making a difference</p>

                <form id="registerFormElement">
                    <Div>Select who are you:</Div>
                    <div class="user-type-buttons">
                        <button class="user-type-btn active" id="customerBtn">
                            <i class="fas fa-user"></i> Citizen
                        </button>
                        <button class="user-type-btn" id="sellerBtn">
                            <i class="fas fa-store"></i> Municipal Staff
                        </button>
                    </div>

                    <div class="input-group" id="adminIdGroup" style="display: none;">
                        <label class="input-label" for="adminId">Government Unique ID</label>
                        <input type="text" id="adminId" class="input-field" placeholder="Enter Government ID">
                    </div>


                    <div class="input-group">
                        <label class="input-label" for="registerName">Full Name</label>
                        <input type="text" id="registerName" class="input-field" placeholder="Full Name" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="registerEmail">Email Address</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="email" id="registerEmail" class="input-field" placeholder="you@example.com"
                                required style="flex: 1;">
                            <button type="button" id="sendOtpBtn"
                                style="padding: 0 15px; border-radius: 12px; border: 1px solid #f5c518; background: #f5c518; cursor: pointer; font-weight: 600; color: #0b1628;">Send
                                OTP</button>
                        </div>
                    </div>

                    <div class="input-group" id="otpGroup" style="display: none;">
                        <label class="input-label" for="otpInput">Enter OTP</label>
                        <input type="text" id="otpInput" class="input-field" placeholder="Enter 6-digit OTP"
                            maxlength="6">
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="mobileNumber">Mobile Number</label>
                        <input type="tel" id="mobileNumber" class="input-field" placeholder="Enter your mobile number"
                            required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" class="input-field"
                            placeholder="Create a strong password" required>
                        <button type="button" class="password-toggle" id="toggleRegisterPassword">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="input-field"
                            placeholder="Confirm your password" required>
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="termsAgreement" required>
                            <label for="termsAgreement">I agree to the <a href="#" style="color: #1a3a8f;">Terms of
                                    Service</a> and <a href="#" style="color: #1a3a8f;">Privacy Policy</a></label>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="registerBtn">Create Account</button>
                </form>


                <div class="form-footer">
                    Already have an account? <a href="login.html" id="switchToLogin">Sign in here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
