<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Issue Reporter - CrowdCivics</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="dashboard full-width">
        <div class="dashboard-header">
            <div>
                <h1>Civic Issue Reporter</h1>
                <p class="subtitle">Welcome, <span id="userName">Citizen</span>. Choose an option from the header.
                </p>
            </div>
            <nav class="header-nav">
                <a href="report.html" class="nav-link">Report Issue</a>
                <a href="#myReportsSection" class="nav-link">My Reports</a>
                <a href="#analyticsSection" class="nav-link">City Overview</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </nav>
        </div>

        <div class="dashboard-grid">

            <div class="card" id="myReportsSection">
                <h2>Your Recent Reports</h2>
                <div id="issueList" class="issue-list">
                </div>
            </div>
        </div>

        <div class="card" id="analyticsSection">
            <h2>Citywide Overview</h2>
            <div id="analyticsSummary" class="analytics-grid">
            </div>
        </div>

        <div class="card">
            <h3>Debug Info (for development)</h3>
            <div id="debugText" class="info-card debug-info">
                Initializing...
            </div>
        </div>

        <div id="message" class="message"></div>
    </div>

    <div class="chat-widget">
        <button id="chatToggle" class="chat-toggle">Chat</button>
        <div id="chatWindow" class="chat-window" aria-hidden="true">
            <div class="chat-header">
                <span>CrowdCivics Assistant</span>
                <button id="chatClose" class="chat-close">&times;</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-form">
                <input id="chatInput" type="text" class="chat-input" placeholder="Ask about issues, status, help..."
                    autocomplete="off" />
                <button type="submit" class="chat-send">Send</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
