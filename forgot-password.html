<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CrowdCivics</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">
    <div class="container">
        <div class="login-card">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email to receive OTP</p>

            <form id="passwordResetForm">
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <div class="input-with-button">
                        <input type="email" id="resetEmail" name="email" placeholder="Enter your registered email"
                            required>
                        <button type="button" id="sendResetOtpBtn" class="btn-secondary">Send OTP</button>
                    </div>
                </div>

                <div class="form-group" id="resetOtpGroup" style="display: none;">
                    <label for="resetOtp">Enter OTP</label>
                    <input type="text" id="resetOtp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                    <small style="color: #666; font-size: 12px;">Check your email for OTP</small>
                </div>

                <div class="form-group" id="resetPasswordGroup" style="display: none;">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required
                        minlength="6">
                </div>

                <button type="submit" class="btn-primary" id="resetBtn" style="display: none;">Reset Password</button>
            </form>

            <div class="links">
                <p><a href="login.html"
                        style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Back to Login</a>
                </p>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
