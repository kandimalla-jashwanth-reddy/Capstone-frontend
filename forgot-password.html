<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CrowdCivics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email to receive OTP</p>
            
            <form id="passwordResetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                </div>
                
                <!-- OTP Field (initially hidden) -->
                <div class="form-group" id="otpGroup" style="display: none;">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                    <small style="color: #666; font-size: 12px;">Check your backend console for the OTP code</small>
                </div>
                
                <!-- Password Field (initially hidden) -->
                <div class="form-group" id="passwordGroup" style="display: none;">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required minlength="6">
                </div>
                
                <button type="button" class="btn-primary" id="resetBtn" onclick="handleResetPassword()">Send OTP</button>
            </form>
            
            <div class="links">
                <p><a href="login.html">Back to Login</a></p>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        let otpSent = false;

        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            console.log(message);
        }

        function startOTPTimer(duration = 60) {
            const button = document.getElementById('resetBtn');
            let timeLeft = duration;
            const originalText = button.textContent;
            button.disabled = true;
            
            const timer = setInterval(() => {
                button.textContent = `Resend OTP (${timeLeft}s)`;
                timeLeft--;
                
                if (timeLeft < 0) {
                    clearInterval(timer);
                    button.disabled = false;
                    button.textContent = 'Resend OTP';
                }
            }, 1000);
        }

        function showResetFields() {
            // Show OTP and Password fields
            document.getElementById('otpGroup').style.display = 'block';
            document.getElementById('passwordGroup').style.display = 'block';
            
            // Change button text
            document.getElementById('resetBtn').textContent = 'Reset Password';
            
            // Focus on OTP field
            setTimeout(() => {
                document.getElementById('otp').focus();
            }, 100);
        }

        async function handleResetPassword() {
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp') ? document.getElementById('otp').value.trim() : '';
            const newPassword = document.getElementById('newPassword') ? document.getElementById('newPassword').value : '';
            
            console.log('Button clicked - Current state:', { 
                email: email, 
                otpSent: otpSent,
                otp: otp,
                newPassword: newPassword ? '***' : 'not set'
            });

            // Basic validation
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            try {
                if (!otpSent) {
                    // STEP 1: Send OTP
                    console.log('STEP 1: Sending OTP to', email);
                    showMessage('Sending OTP...', 'info');
                    
                    const response = await fetch('http://localhost:8080/api/auth/send-reset-otp', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email: email })
                    });
                    
                    const result = await response.text();
                    console.log('OTP Response:', response.status, result);
                    
                    if (response.ok) {
                        showMessage('OTP sent successfully! Check your backend console for the OTP code. Enter the OTP and new password below.', 'success');
                        otpSent = true;
                        
                        // Show OTP and Password fields
                        showResetFields();
                        
                        // Start OTP timer
                        startOTPTimer();
                        
                    } else {
                        showMessage('Failed to send OTP: ' + result, 'error');
                    }
                    
                } else {
                    // STEP 2: Reset Password with OTP
                    console.log('STEP 2: Resetting password');
                    
                    if (!otp || otp.length !== 6) {
                        showMessage('Please enter a valid 6-digit OTP', 'error');
                        return;
                    }
                    
                    if (!newPassword || newPassword.length < 6) {
                        showMessage('Password must be at least 6 characters', 'error');
                        return;
                    }
                    
                    showMessage('Resetting password...', 'info');
                    
                    const response = await fetch('http://localhost:8080/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: email,
                            newPassword: newPassword,
                            otp: otp
                        })
                    });
                    
                    const result = await response.text();
                    console.log('Reset Response:', response.status, result);
                    
                    if (response.ok) {
                        showMessage('Password reset successful! Redirecting to login...', 'success');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        showMessage('Password reset failed: ' + result, 'error');
                    }
                }
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('Operation failed. Please check your connection.', 'error');
            }
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        console.log('Forgot password page loaded successfully');
        console.log('Reset button:', document.getElementById('resetBtn'));
        console.log('OTP group:', document.getElementById('otpGroup'));
        console.log('Password group:', document.getElementById('passwordGroup'));
    </script>
</body>
</html>
