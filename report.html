<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - CrowdCivics</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="dashboard-header">
        <div style="font-weight: 700; font-size: 1.5rem; color: white;">CrowdCivics</div>
        <nav class="header-nav" style="display: flex; gap: 1rem; align-items: center;">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="profile.html" class="nav-link">Profile</a>
            <a href="#" class="nav-link btn-secondary" id="logoutBtn" style="padding: 0.5rem 1rem;">Logout</a>
        </nav>
    </nav>

    <div class="container"
        style="flex-direction: column; justify-content: flex-start; align-items: center; padding: 20px; max-width: 100%; min-height: 100vh; width: 100%; box-sizing: border-box;">
        <h2 style="font-size: 2.2rem; margin-bottom: 10px; text-align: center; color: var(--accent-color);">Report
            an Issue</h2>
        <p class="subtitle" style="text-align: center; font-size: 1.1rem; margin-bottom: 30px;">Help us improve your
            city by reporting problems.</p>

        <form id="reportForm" onsubmit="event.preventDefault();" style="width: 100%;">
            <div class="form-group">
                <label for="title">Issue Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. Pothole on Main St" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="POTHOLE">Pothole / Road Damage</option>
                    <option value="STREETLIGHT">Broken Streetlight</option>
                    <option value="GARBAGE">Garbage / Sanitation</option>
                    <option value="WATER">Water Leak / Pipe Issue</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <div class="form-group" id="otherCategoryGroup" style="display: none;">
                <label for="otherCategory">Please Specify Category</label>
                <input type="text" id="otherCategory" name="otherCategory" placeholder="Enter custom category">
            </div>

            <div class="form-group">
                <label for="address">Location / Address</label>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="address" name="address"
                        placeholder="Detected address will appear here or enter manually"
                        style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;">
                    <button type="button" id="getLocationBtn" class="btn-secondary"
                        style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        📍 Get My Location
                    </button>
                </div>
                <div id="locationInfo" class="location-info">
                    <span>Detected Location:</span> <span id="coords"></span>
                </div>
                <input type="hidden" id="latitude" name="latitude">
                <input type="hidden" id="longitude" name="longitude">
            </div>

            <div class="form-group">
                <label>Photo Evidence (Up to 5 photos)</label>

                <div class="upload-area" id="dropZone" style="cursor: pointer; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 30px; text-align: center; transition: all 0.3s ease; background: #f8fafc;">
                    <p style="margin: 0; color: #64748b; font-size: 1.1rem;">📸 Click to take photos or upload multiple</p>
                    <input type="file" id="fileInput" accept="image/*" capture="environment" multiple style="display: none;">
                </div>

                <div id="photoPreviewContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-top: 20px;">
                    <!-- Previews will be dynamically added here -->
                </div>

                <input type="hidden" id="photoData">
            </div>

            <div class="form-group">
                <label for="description">Description & Details</label>
                <textarea id="description" name="description" rows="4"
                    style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit;"
                    placeholder="Describe the issue in detail..."></textarea>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Submit Report</button>
        </form>

        <div id="message" class="message"></div>
    </div>

        <div id="message" class="message"></div>
    </div>


    <script src="main.js"></script>
    <script>
    </script>
</body>

</html>
